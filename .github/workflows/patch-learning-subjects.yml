name: Wire interactive learning area

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-learning-subjects.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Subjects route
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text()
          import_line = "import LearningSubjectsPage from './LearningSubjects.jsx'\n"
          anchor = "import { supabase } from './supabase.js'\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find import anchor')
              text = text.replace(anchor, anchor + import_line, 1)
          old = "{route==='subjects' && <SubjectsPage {...common()} />}"
          new = "{route==='subjects' && <LearningSubjectsPage {...common()} />}"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not find Subjects route')
          p.write_text(text)
      - name: Commit source patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Use interactive learner-facing Subjects area"
          git push origin main
