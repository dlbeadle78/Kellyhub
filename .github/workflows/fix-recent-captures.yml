name: Fix recent captures UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Fix recent captures display and file opening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Quick Capture recent cards
        run: |
          python - <<'PY'
          from pathlib import Path

          jsx_path = Path('src/QuickCaptureV2.jsx')
          text = jsx_path.read_text()

          old_state = "  const [busy,setBusy]=useState(false),[drag,setDrag]=useState(false),[enhance,setEnhance]=useState(true),[accepted,setAccepted]=useState(false)"
          new_state = old_state + "\n  const [openingFileId,setOpeningFileId]=useState(null)"
          if 'openingFileId' not in text:
              if old_state not in text:
                  raise SystemExit('Could not find Quick Capture state line')
              text = text.replace(old_state, new_state, 1)

          marker = "  function acceptSuggestion(){if(suggestion.subject)setSubject(suggestion.subject);setAccepted(true)}"
          open_fn = """  async function openAttachment(file){
    if(!file?.storage_path)return notify?.('This capture does not have a stored file to open.')
    setOpeningFileId(file.id)
    const preview=window.open('about:blank','_blank')
    if(preview){preview.opener=null;preview.document.title='Opening capture…'}
    const {data,error}=await supabase.storage.from('user-files').createSignedUrl(file.storage_path,600)
    setOpeningFileId(null)
    if(error||!data?.signedUrl){if(preview)preview.close();return notify?.(error?.message||'Could not open this capture.')}
    if(preview)preview.location.replace(data.signedUrl)
    else window.open(data.signedUrl,'_blank','noopener,noreferrer')
  }"""
          if 'async function openAttachment(file)' not in text:
              if marker not in text:
                  raise SystemExit('Could not find acceptSuggestion marker')
              text = text.replace(marker, marker + "\n\n" + open_fn, 1)

          old_recent = '''        <section className="qc-recent"><h2>Recent captures</h2>{recent.map(c=>{const attached=files.filter(f=>f.capture_id===c.id);return <article key={c.id}><span className="qc-kind">{c.capture_type==='link'?<Link2/>:c.capture_type==='image'?<Image/>:<File/>}</span><div><strong>{c.title||c.source_url||attached[0]?.original_name||'Quick capture'}</strong><small>{c.subject_slug||c.suggested_subject_slug||'Unsorted'} · {new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(new Date(c.created_at))}</small>{c.content&&<p>{c.content}</p>}{attached.length>0&&<span className="qc-attachments">{attached.length} file{attached.length===1?'':'s'} attached</span>}</div></article>})}{!recent.length&&<div className="qc-empty">Nothing captured yet.</div>}</section>'''
          new_recent = '''        <section className="qc-recent">
          <div className="qc-recent-head"><div><h2>Recent captures</h2><p>Open saved screenshots and files directly from here.</p></div></div>
          <div className="qc-recent-list">{recent.map(c=>{const attached=files.filter(f=>f.capture_id===c.id);return <article key={c.id}><span className="qc-kind">{c.capture_type==='link'?<Link2/>:c.capture_type==='image'?<Image/>:<File/>}</span><div className="qc-recent-body"><strong className="qc-recent-title">{c.title||c.source_url||attached[0]?.original_name||'Quick capture'}</strong><small>{c.subject_slug||c.suggested_subject_slug||'Unsorted'} · {new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(new Date(c.created_at))}</small>{c.content&&<p className="qc-recent-content">{c.content}</p>}{attached.length>0&&<div className="qc-attachment-actions">{attached.map((file,index)=>{const isImage=(file.mime_type||'').startsWith('image/');return <button type="button" key={file.id||file.storage_path} onClick={()=>openAttachment(file)} disabled={openingFileId===file.id}><ExternalLink size={14}/><span>{openingFileId===file.id?'Opening…':isImage?'View screenshot':attached.length>1?`Open file ${index+1}`:'Open file'}</span></button>})}</div>}</div></article>})}{!recent.length&&<div className="qc-empty">Nothing captured yet.</div>}</div>
        </section>'''
          if 'qc-recent-list' not in text:
              if old_recent not in text:
                  raise SystemExit('Could not find current Recent captures block')
              text = text.replace(old_recent, new_recent, 1)

          jsx_path.write_text(text)

          css_path = Path('src/quick-capture.css')
          css = css_path.read_text()
          marker_css = '/* recent-captures-v2 */'
          if marker_css not in css:
              css += '''\n/* recent-captures-v2 */\n.qc-recent{min-width:0;overflow:hidden}.qc-recent-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.qc-recent-head h2{margin:0;font-size:1.15rem}.qc-recent-head p{margin:3px 0 0;font-size:.7rem;color:var(--muted);line-height:1.35}.qc-recent-list{display:flex;flex-direction:column;gap:9px;min-width:0}.qc-recent-list article{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:11px;border:1px solid var(--border);border-radius:11px;background:var(--panel-2);min-width:0;overflow:hidden}.qc-recent-list article:first-child{border-top:1px solid var(--border)}.qc-recent-body{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}.qc-recent-title{font-size:.8rem;line-height:1.35;overflow-wrap:anywhere;word-break:break-word;min-width:0}.qc-recent-content{font-size:.74rem;line-height:1.4;margin:3px 0 0;color:var(--muted);overflow-wrap:anywhere;word-break:break-word;max-height:4.2em;overflow:hidden}.qc-recent-body>small{font-size:.68rem;color:var(--muted);overflow-wrap:anywhere}.qc-attachment-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.qc-attachment-actions button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 9px;font:inherit;font-size:.7rem;font-weight:800;display:inline-flex;align-items:center;gap:5px;max-width:100%;cursor:pointer}.qc-attachment-actions button:hover{border-color:var(--purple);color:var(--purple)}.qc-attachment-actions button:disabled{opacity:.6;cursor:wait}.qc-attachment-actions button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qc-kind{flex:0 0 32px}@media(max-width:600px){.qc-recent-list article{padding:10px}.qc-recent-content{max-height:5.6em}.qc-attachment-actions button{width:100%;justify-content:center}}\n'''
              css_path.write_text(css)
          PY
      - name: Commit fix
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/QuickCaptureV2.jsx src/quick-capture.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix recent captures display and file opening"
          git push
