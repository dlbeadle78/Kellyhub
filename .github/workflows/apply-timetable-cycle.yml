name: Apply timetable cycle support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-timetable-cycle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch timetable cycle support
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text()

          if 'function timetableWeekForDate' not in text:
              marker = "function classNames(...items) { return items.filter(Boolean).join(' ') }"
              helper = """function timetableWeekForDate(value = new Date()) {\n  const anchor = new Date(2026, 7, 31)\n  anchor.setHours(0,0,0,0)\n  const current = new Date(value)\n  current.setHours(0,0,0,0)\n  const weekIndex = Math.floor((current - anchor) / 604800000)\n  return (((weekIndex % 2) + 2) % 2) + 1\n}\n\n"""
              if marker not in text:
                  raise SystemExit('Could not find helper insertion point')
              text = text.replace(marker, helper + marker, 1)

          old = "  const todayLessons = timetable.filter(x=>x.day_of_week===todayIndex)"
          new = "  const currentWeek = timetableWeekForDate(new Date())\n  const todayLessons = timetable.filter(x=>x.day_of_week===todayIndex && (x.week_number || 1)===currentWeek)"
          if old in text:
              text = text.replace(old, new, 1)

          old = "function PlannerPage({ session, subjects, events, timetable, travel, loadAll, notify }) {\n  const [tab,setTab]=useState('week')"
          new = "function PlannerPage({ session, subjects, events, timetable, travel, loadAll, notify }) {\n  const [tab,setTab]=useState('week')\n  const currentWeek=timetableWeekForDate(new Date())"
          if old in text:
              text = text.replace(old, new, 1)

          old = "const {error}=await supabase.from('timetable_entries').insert({user_id:session.user.id,day_of_week:Number(fd.get('day')),start_time:fd.get('start'),end_time:fd.get('end'),label:fd.get('label'),subject_slug:fd.get('subject')||null,entry_type:fd.get('type')})"
          new = "const {error}=await supabase.from('timetable_entries').insert({user_id:session.user.id,week_number:currentWeek,day_of_week:Number(fd.get('day')),start_time:fd.get('start'),end_time:fd.get('end'),label:fd.get('label'),subject_slug:fd.get('subject')||null,entry_type:fd.get('type')})"
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace(">Week</button><button className={tab==='events'?", ">Week {currentWeek}</button><button className={tab==='events'?", 1)
          text = text.replace("timetable.filter(x=>x.day_of_week===i+1).map", "timetable.filter(x=>x.day_of_week===i+1&&(x.week_number||1)===currentWeek).map", 1)
          text = text.replace("!timetable.some(x=>x.day_of_week===i+1)&&", "!timetable.some(x=>x.day_of_week===i+1&&(x.week_number||1)===currentWeek)&&", 1)

          p.write_text(text)
      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Support alternating Week 1 and Week 2 timetable"
          git push origin main
