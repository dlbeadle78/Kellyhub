name: Wire learning depth styles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/learning-depth-css.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Add depth stylesheet import
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/LearningSubjects.jsx')
          text=p.read_text()
          line="import './learning-depth.css'\n"
          anchor="import './learning.css'\n"
          if line not in text:
              if anchor not in text: raise SystemExit('CSS import anchor missing')
              text=text.replace(anchor,anchor+line,1)
          p.write_text(text)
      - name: Commit
        run: |
          if git diff --quiet -- src/LearningSubjects.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LearningSubjects.jsx
          git commit -m "Use A-level learning depth styles"
          git push origin main
