name: Wire Phase 2 routes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase2-wire.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wire Phase 2
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx')
          text=p.read_text()
          anchor="import StuckV2 from './StuckV2.jsx'\n"
          imports="import Phase2Resources from './Phase2Resources.jsx'\nimport Phase2Progress from './Phase2Progress.jsx'\nimport Phase2Settings from './Phase2Settings.jsx'\nimport NotificationManager from './NotificationManager.jsx'\n"
          if "import Phase2Resources from './Phase2Resources.jsx'" not in text:
              if anchor not in text: raise SystemExit('Import anchor missing')
              text=text.replace(anchor,anchor+imports,1)
          replacements={
            "{route==='progress' && <ProgressPage {...common()} />}":"{route==='progress' && <Phase2Progress {...common()} />}",
            "{route==='resources' && <ResourcesPage {...common()} />}":"{route==='resources' && <Phase2Resources {...common()} />}",
            "{route==='settings' && <SettingsPage {...common()} />}":"{route==='settings' && <Phase2Settings {...common()} />}"
          }
          for old,new in replacements.items():
              if old in text:text=text.replace(old,new,1)
              elif new not in text:raise SystemExit(f'Route missing: {old}')
          marker="    {toast && <div className=\"toast\" role=\"status\">{toast}</div>}\n"
          manager="    <NotificationManager session={session} timetable={timetable} tasks={tasks} steps={steps} />\n"
          if manager not in text:
              if marker not in text: raise SystemExit('Global marker missing')
              text=text.replace(marker,manager+marker,1)
          p.write_text(text)
      - name: Commit
        run: |
          if git diff --quiet -- src/App.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Use Phase 2 resources progress settings and notifications"
          git push origin main
