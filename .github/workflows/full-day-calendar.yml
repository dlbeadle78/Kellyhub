name: Expand planner to full days
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full-day-calendar.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show full 24-hour days
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/WeeklyPlanner.jsx')
          text=p.read_text()
          text=text.replace('const START_HOUR = 6\nconst END_HOUR = 23','const START_HOUR = 0\nconst END_HOUR = 24',1)
          p.write_text(text)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WeeklyPlanner.jsx
          git commit -m "Show full 24-hour days in planner"
          git push origin main
