name: Run Learning Library UI patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.head_commit.message != 'Wire captures into Learning Library' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/wire-learning-library.mjs
      - name: Commit changes
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/App.jsx src/QuickCaptureV2.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire captures into Learning Library"
          git push
