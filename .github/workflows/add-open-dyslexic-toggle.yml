name: Add OpenDyslexic top bar toggle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-open-dyslexic-toggle.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add top bar toggle
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text()
          old = """          <button title=\"Text size\" onClick={()=>updateProfile({ text_scale: profile?.text_scale >= 1.2 ? 1 : Number(((profile?.text_scale || 1)+0.1).toFixed(1)) })}><span className=\"aa\">A<span>A</span></span><small>Text size</small></button>\n          <SpeechControls compact getText={()=>mainRef.current?.innerText || ''} label=\"Read aloud\" />"""
          new = """          <button title=\"Text size\" onClick={()=>updateProfile({ text_scale: profile?.text_scale >= 1.2 ? 1 : Number(((profile?.text_scale || 1)+0.1).toFixed(1)) })}><span className=\"aa\">A<span>A</span></span><small>Text size</small></button>\n          <button title={profile?.dyslexic_font ? 'Turn OpenDyslexic off' : 'Turn OpenDyslexic on'} aria-pressed={Boolean(profile?.dyslexic_font)} onClick={()=>updateProfile({ dyslexic_font: !profile?.dyslexic_font })}><Accessibility/><small>OpenDyslexic {profile?.dyslexic_font ? 'On' : 'Off'}</small></button>\n          <SpeechControls compact getText={()=>mainRef.current?.innerText || ''} label=\"Read aloud\" />"""
          if old not in text:
              raise SystemExit('Expected top bar block not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Add OpenDyslexic top bar toggle"
          git push origin main
