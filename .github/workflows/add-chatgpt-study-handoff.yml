name: Complete ChatGPT Study handoff prompt fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-chatgpt-study-handoff.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix copied prompt newlines
        env:
          PATCH_SCRIPT_B64: ""
        run: echo "$PATCH_SCRIPT_B64" | base64 --decode | python3
      - name: Commit prompt fix
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/LearningSubjects.jsx
          git commit -m "Fix ChatGPT Study handoff prompt formatting"
          git push origin main
