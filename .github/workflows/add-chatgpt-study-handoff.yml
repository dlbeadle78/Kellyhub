name: Add ChatGPT Study handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-chatgpt-study-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch learning section handoffs
        env:
          PATCH_SCRIPT_B64: ""
        run: echo "$PATCH_SCRIPT_B64" | base64 --decode | python3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build
      - name: Commit Study handoff
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/LearningSubjects.jsx src/learning-depth.css
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Add ChatGPT Study handoff to learning sections"
            git push origin main
          fi
