name: Patch automatic capture reading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.head_commit.message != 'Read screenshots automatically during capture' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply capture reading patch
        run: node scripts/patch-capture-auto-read.mjs
      - name: Commit changes
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/QuickCaptureV2.jsx src/CapturePurposeRouter.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Read screenshots automatically during capture"
          git push
