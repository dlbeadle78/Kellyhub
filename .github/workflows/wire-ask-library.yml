name: Wire Ask My Library

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.head_commit.message != 'Wire Ask My Library into Library page' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply wiring
        run: node scripts/wire-ask-library.mjs
      - name: Commit changes
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/Phase4Library.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire Ask My Library into Library page"
          git push
