name: Apply Learning Library UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Wire captures into Learning Library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and Quick Capture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('src/App.jsx')
          text=app.read_text()
          text=text.replace('  Upload, UserRound, Volume2, X, FileText, University, Brain, ShieldCheck\n', '  Upload, UserRound, Volume2, X, FileText, University, Brain, ShieldCheck, FolderOpen\n')
          if "import Phase4Library from './Phase4Library.jsx'" not in text:
              text=text.replace("import Phase2Resources from './Phase2Resources.jsx'\n", "import Phase2Resources from './Phase2Resources.jsx'\nimport Phase4Library from './Phase4Library.jsx'\n")
          if "['library', 'My Library', FolderOpen]" not in text:
              text=text.replace("  ['resources', 'Resources & AI', NotebookTabs],\n", "  ['library', 'My Library', FolderOpen],\n  ['resources', 'Resources & AI', NotebookTabs],\n")
          if "route==='library' && <Phase4Library" not in text:
              text=text.replace("        {route==='resources' && <Phase2Resources {...common()} />}\n", "        {route==='library' && <Phase4Library {...common()} />}\n        {route==='resources' && <Phase2Resources {...common()} />}\n")
          app.write_text(text)

          qc=Path('src/QuickCaptureV2.jsx')
          text=qc.read_text()
          text=text.replace("import { Camera, CheckCircle2, Clipboard, Download, ExternalLink, File, Image, Link2, Plus, ScanLine, Sparkles, Upload } from 'lucide-react'", "import { BookOpen, Camera, CheckCircle2, CheckSquare, Clipboard, Download, ExternalLink, File, FolderOpen, Image, Link2, Plus, ScanLine, Sparkles, Target, Upload } from 'lucide-react'")
          text=text.replace("export default function QuickCaptureV2({session,subjects=[],captures=[],files=[],loadAll,notify}){", "export default function QuickCaptureV2({session,subjects=[],captures=[],files=[],loadAll,notify,go}){")
          old_state="  const [busy,setBusy]=useState(false),[drag,setDrag]=useState(false),[enhance,setEnhance]=useState(true),[accepted,setAccepted]=useState(false)\n  const [openingFileId,setOpeningFileId]=useState(null)"
          new_state=old_state+"\n  const [libraryItems,setLibraryItems]=useState([]),[processingPurpose,setProcessingPurpose]=useState('')"
          if 'processingPurpose' not in text:
              if old_state not in text: raise SystemExit('Quick Capture state marker not found')
              text=text.replace(old_state,new_state,1)

          paste_effect="  useEffect(()=>{const onPaste=e=>{const pasted=Array.from(e.clipboardData?.files||[]);if(pasted.length){e.preventDefault();setQueued(current=>[...current,...pasted]);notify?.('Screenshot added to Quick Capture.')}};window.addEventListener('paste',onPaste);return()=>window.removeEventListener('paste',onPaste)},[])"
          library_effect="""  useEffect(()=>{const uid=session?.user?.id;if(!uid)return;supabase.from('library_items').select('*').eq('user_id',uid).eq('status','active').then(({data,error})=>{if(error)notify?.(error.message);else setLibraryItems(data||[])})},[session?.user?.id])"""
          if library_effect not in text:
              if paste_effect not in text: raise SystemExit('Paste effect marker not found')
              text=text.replace(paste_effect,paste_effect+'\n'+library_effect,1)

          save_marker='  async function save(e){'
          helpers=r'''  function captureSource(c){
    if(c?.source_url)return c.source_url
    const match=String(c?.content||'').match(/(?:Source:\s*)?(https?:\/\/[^\s]+)/i)
    return match?.[1]||null
  }
  function captureTitle(c){
    return c?.title||files.find(f=>f.capture_id===c?.id)?.original_name||'Captured resource'
  }
  function captureText(c){
    let value=String(c?.content||'').replace(/(?:^|\n)Source:\s*https?:\/\/[^\s]+/ig,'').trim()
    if(/^https?:\/\/\S+$/i.test(value))value=''
    return value||null
  }
  function chunkText(value,max=1200){
    const text=String(value||'').trim();if(!text)return []
    const chunks=[];let rest=text
    while(rest.length>max){let cut=rest.lastIndexOf(' ',max);if(cut<max*.6)cut=max;chunks.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim()}
    if(rest)chunks.push(rest);return chunks.slice(0,30)
  }
  function suggestedPurpose(c){
    if(c?.suggested_type==='teacher_feedback')return'improve'
    if(c?.suggested_type==='school_task')return'do'
    if(c?.suggested_type==='revision')return'learn'
    return'learn'
  }
  async function processCapture(c,purpose){
    const uid=session?.user?.id;if(!uid)return
    const key=`${c.id}:${purpose}`
    if(libraryItems.some(item=>item.capture_id===c.id&&item.purpose===purpose))return notify?.('This capture is already filed that way.')
    setProcessingPurpose(key)
    const subjectSlug=c.subject_slug||c.suggested_subject_slug||null
    const sourceUrl=captureSource(c),extracted=captureText(c),title=captureTitle(c)
    const summary=extracted?extracted.slice(0,500):`Original ${c.capture_type||'capture'} saved in Kellyn Hub.`
    const {data:item,error:itemError}=await supabase.from('library_items').insert({user_id:uid,capture_id:c.id,subject_slug:subjectSlug,title,purpose,resource_type:c.suggested_type||c.capture_type||'resource',source_url:sourceUrl,summary,extracted_text:extracted}).select().single()
    if(itemError){setProcessingPurpose('');return notify?.(itemError.message)}
    let finalItem=item
    if(extracted){
      const chunks=chunkText(extracted).map((content,index)=>({user_id:uid,library_item_id:item.id,chunk_index:index,content,source_label:title}))
      if(chunks.length){const {error}=await supabase.from('library_chunks').insert(chunks);if(error)notify?.('Saved to Library, but searchable text could not be prepared yet.')}
    }
    if(purpose==='do'){
      const dueAt=c.suggested_due_date?new Date(`${c.suggested_due_date}T16:00:00`).toISOString():null
      const description=[extracted,sourceUrl?`Source: ${sourceUrl}`:''].filter(Boolean).join('\n\n')||'Created from a Kellyn Hub capture. Open the original attachment for the teacher instructions.'
      const {data:task,error:taskError}=await supabase.from('tasks').insert({user_id:uid,subject_slug:subjectSlug,title,description,due_at:dueAt,next_action:'Open the original teacher instructions and identify exactly what needs to be completed.'}).select().single()
      if(taskError){await supabase.from('library_items').delete().eq('id',item.id);setLibraryItems(current=>current.filter(x=>x.id!==item.id));setProcessingPurpose('');return notify?.(taskError.message)}
      const safeSteps=['Read the original instructions and identify what the teacher is asking.','Check the deadline, command word and what needs to be submitted.','Gather the relevant notes, sources or teacher guidance.','Make a simple plan in your own words and start the first section.']
      await supabase.from('task_steps').insert(safeSteps.map((step,index)=>({task_id:task.id,user_id:uid,title:step,order_index:index,completed:false})))
      await supabase.from('user_files').update({task_id:task.id,subject_slug:subjectSlug}).eq('user_id',uid).eq('capture_id',c.id)
      const {data:updated}=await supabase.from('library_items').update({linked_task_id:task.id}).eq('id',item.id).select().single();if(updated)finalItem=updated
    }
    if(purpose==='improve'){
      const target=extracted?extracted.slice(0,1000):'Review the captured teacher feedback and identify one specific improvement to practise next.'
      const {error}=await supabase.from('feedback_targets').insert({user_id:uid,capture_id:c.id,library_item_id:item.id,subject_slug:subjectSlug,title:`Improve: ${title}`,target})
      if(error)notify?.('Saved to Library, but the feedback target could not be created.')
    }
    await supabase.from('quick_capture').update({library_status:'partly_processed',library_processed_at:new Date().toISOString()}).eq('id',c.id).eq('user_id',uid)
    setLibraryItems(current=>[finalItem,...current]);setProcessingPurpose('');await loadAll?.()
    notify?.(purpose==='do'?'Added to My Work and My Library.':purpose==='improve'?'Saved as feedback to improve from.':purpose==='learn'?'Added to the Learning Library.':'Saved as a reference in My Library.')
  }

'''
          if 'async function processCapture(c,purpose)' not in text:
              if save_marker not in text: raise SystemExit('Save marker not found')
              text=text.replace(save_marker,helpers+save_marker,1)

          pattern=re.compile(r'''        <section className="qc-recent">.*?        </section>''',re.S)
          new_recent=r'''        <section className="qc-recent">
          <div className="qc-recent-head"><div><h2>Capture inbox</h2><p>Open the original, then tell Kellyn Hub what the capture is for.</p></div><button className="qc-library-link" type="button" onClick={()=>go?.('library')}><FolderOpen size={15}/> My Library</button></div>
          <div className="qc-recent-list">{recent.map(c=>{const attached=files.filter(f=>f.capture_id===c.id),filed=libraryItems.filter(i=>i.capture_id===c.id).map(i=>i.purpose),suggested=suggestedPurpose(c);return <article key={c.id}><span className="qc-kind">{c.capture_type==='link'?<Link2/>:c.capture_type==='image'?<Image/>:<File/>}</span><div className="qc-recent-body"><strong className="qc-recent-title">{c.title||c.source_url||attached[0]?.original_name||'Quick capture'}</strong><small>{c.subject_slug||c.suggested_subject_slug||'Unsorted'} · {new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(new Date(c.created_at))}</small>{c.content&&<p className="qc-recent-content">{c.content}</p>}{attached.length>0&&<div className="qc-attachment-actions">{attached.map((file,index)=>{const isImage=(file.mime_type||'').startsWith('image/');return <button type="button" key={file.id||file.storage_path} onClick={()=>openAttachment(file)} disabled={openingFileId===file.id}><ExternalLink size={14}/><span>{openingFileId===file.id?'Opening…':isImage?'View screenshot':attached.length>1?`Open file ${index+1}`:'Open file'}</span></button>})}</div>}<div className="qc-use-capture"><div className="qc-use-head"><span><strong>Use this capture</strong><small>Suggested: {suggested==='do'?'Schoolwork':suggested==='improve'?'Teacher feedback':'Learning resource'}</small></span>{filed.length>0&&<button type="button" onClick={()=>go?.('library')}>Filed · view</button>}</div><div className="qc-purpose-actions"><button type="button" className={filed.includes('learn')?'done':suggested==='learn'?'suggested':''} disabled={filed.includes('learn')||processingPurpose===`${c.id}:learn`} onClick={()=>processCapture(c,'learn')}><BookOpen/><span>{processingPurpose===`${c.id}:learn`?'Adding…':'Learn'}</span><small>Use for revision</small></button><button type="button" className={filed.includes('do')?'done':suggested==='do'?'suggested':''} disabled={filed.includes('do')||processingPurpose===`${c.id}:do`} onClick={()=>processCapture(c,'do')}><CheckSquare/><span>{processingPurpose===`${c.id}:do`?'Adding…':'Do'}</span><small>Create My Work</small></button><button type="button" className={filed.includes('improve')?'done':suggested==='improve'?'suggested':''} disabled={filed.includes('improve')||processingPurpose===`${c.id}:improve`} onClick={()=>processCapture(c,'improve')}><Target/><span>{processingPurpose===`${c.id}:improve`?'Adding…':'Improve'}</span><small>Teacher feedback</small></button><button type="button" className={filed.includes('keep')?'done':''} disabled={filed.includes('keep')||processingPurpose===`${c.id}:keep`} onClick={()=>processCapture(c,'keep')}><FolderOpen/><span>{processingPurpose===`${c.id}:keep`?'Adding…':'Keep'}</span><small>Reference</small></button></div></div></div></article>})}{!recent.length&&<div className="qc-empty">Nothing captured yet.</div>}</div>
        </section>'''
          if 'qc-purpose-actions' not in text:
              text,count=pattern.subn(new_recent,text,count=1)
              if count!=1: raise SystemExit('Recent captures block not found')
          qc.write_text(text)

          css=Path('src/quick-capture.css')
          style=css.read_text()
          if '/* capture-purpose-routing */' not in style:
              style += '''\n/* capture-purpose-routing */\n.qc-library-link{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 9px;font:inherit;font-size:.69rem;font-weight:800;display:flex;align-items:center;gap:5px;white-space:nowrap}.qc-use-capture{margin-top:8px;border-top:1px solid var(--border);padding-top:9px}.qc-use-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.qc-use-head>span{display:flex;flex-direction:column;gap:1px}.qc-use-head strong{font-size:.72rem}.qc-use-head small{font-size:.62rem;color:var(--muted)}.qc-use-head>button{border:0;background:transparent;color:var(--purple);font-size:.65rem;font-weight:800;padding:3px}.qc-purpose-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.qc-purpose-actions>button{min-width:0;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:0 6px;text-align:left;align-items:center;font:inherit}.qc-purpose-actions>button>svg{grid-row:1/3;height:15px;width:15px}.qc-purpose-actions>button>span{font-size:.68rem;font-weight:850}.qc-purpose-actions>button>small{font-size:.57rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qc-purpose-actions>button.suggested{border-color:var(--purple);background:var(--purple-2)}.qc-purpose-actions>button.done{background:#e5f3ec;color:#285e46;border-color:#bcdccb}.qc-purpose-actions>button.done small{color:#47745f}.qc-purpose-actions>button:disabled{cursor:default;opacity:.82}@media(max-width:600px){.qc-recent-head{flex-direction:column}.qc-library-link{align-self:flex-start}.qc-purpose-actions{grid-template-columns:1fr}}\n'''
              css.write_text(style)
          PY
      - name: Commit changes
        run: |
          git config user.name "dlbeadle78"
          git config user.email "dlbeadle@icloud.com"
          git add src/App.jsx src/QuickCaptureV2.jsx src/quick-capture.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire captures into Learning Library"
          git push
