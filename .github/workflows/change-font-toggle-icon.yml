name: Change font toggle icon
on:
  push:
    branches: [main]
    paths: ['.github/workflows/change-font-toggle-icon.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace accessibility icon with typography icon
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text()
          old = "<Accessibility/><small>OpenDyslexic {profile?.dyslexic_font ? 'On' : 'Off'}</small>"
          new = "<span aria-hidden=\"true\" style={{fontWeight:900,fontSize:'1.05rem',letterSpacing:'-0.04em',lineHeight:1}}>Aa</span><small>OpenDyslexic {profile?.dyslexic_font ? 'On' : 'Off'}</small>"
          if old not in text:
              raise SystemExit('OpenDyslexic toggle icon block not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Use typography icon for OpenDyslexic toggle"
          git push origin main
